name: Sync Codeforces Submissions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: python -m pip install --upgrade requests beautifulsoup4

      - name: Sync accepted Codeforces submissions and source code
        env:
          CF_HANDLE: "venkous_7"
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys
          import time
          from datetime import datetime, timezone
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          handle = os.environ.get("CF_HANDLE", "").strip()
          if not handle:
              print("CF_HANDLE is empty; skipping sync.")
              sys.exit(0)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; github-actions-codeforces-sync/1.0)"
          })

          api_url = "https://codeforces.com/api/user.status"
          print(f"Fetching Codeforces submissions for handle: {handle}")
          try:
              response = session.get(
                  api_url,
                  params={"handle": handle, "from": 1, "count": 1000},
                  timeout=30,
              )
              response.raise_for_status()
              payload = response.json()
          except Exception as error:
              print(f"Codeforces API request failed: {error}")
              sys.exit(1)

          if payload.get("status") != "OK":
              message = payload.get("comment") or payload.get("error") or str(payload)
              print(f"Codeforces API returned an error for handle '{handle}': {message}")
              sys.exit(1)

          accepted = [
              submission for submission in payload.get("result", [])
              if submission.get("verdict") == "OK"
              and submission.get("problem", {}).get("contestId") is not None
              and submission.get("problem", {}).get("index")
          ]
          # user.status is newest-first. Processing oldest-first means the newest
          # accepted submission becomes the final version of each problem file.
          accepted.reverse()
          print(f"Found {len(accepted)} accepted submissions with problem metadata.")

          extension_by_language = {
              "Python 2": "py", "Python 3": "py", "PyPy 2": "py", "PyPy 3": "py",
              "GNU C++": "cpp", "GNU C++17": "cpp", "GNU C++20": "cpp",
              "GNU C++23": "cpp", "MS C++": "cpp", "C++": "cpp",
              "Java": "java", "Java 8": "java", "Java 11": "java", "Java 17": "java",
              "Kotlin": "kt", "JavaScript": "js", "Node.js": "js",
              "Go": "go", "Rust": "rs", "C": "c", "C#": "cs", "PHP": "php",
              "Ruby": "rb", "Scala": "scala", "Haskell": "hs", "D": "d",
          }

          def safe_name(value):
              value = re.sub(r"[^A-Za-z0-9._-]+", "_", value or "problem")
              return value.strip("._") or "problem"

          def source_for(submission):
              contest_id = submission["contestId"]
              submission_id = submission["id"]
              url = f"https://codeforces.com/contest/{contest_id}/submission/{submission_id}"
              page = session.get(url, timeout=30)
              page.raise_for_status()
              soup = BeautifulSoup(page.text, "html.parser")
              source = soup.select_one("pre#program-source-text")
              if source is None:
                  raise RuntimeError("source element was not present (Codeforces may require login or blocked the request)")
              return source.get_text(), url

          changed_files = []
          for submission in accepted:
              problem = submission["problem"]
              problem_id = f"{problem['contestId']}{problem['index']}"
              problem_name = safe_name(problem.get("name", problem_id))
              language = submission.get("programmingLanguage", "")
              extension = extension_by_language.get(language, "txt")
              target = Path("Codeforces") / problem_id / f"{problem_name}.{extension}"

              try:
                  source, source_url = source_for(submission)
                  if not source.strip():
                      raise RuntimeError("source was empty")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(source.rstrip() + "\n", encoding="utf-8")
                  changed_files.append(str(target))
                  print(f"Saved {target} from submission {submission['id']} ({source_url})")
              except Exception as error:
                  print(f"Could not fetch submission {submission['id']}: {error}")
              time.sleep(0.5)

          if not changed_files:
              print("No source files were fetched; nothing to commit.")
              sys.exit(0)

          subprocess.run(["git", "config", "user.name", "GitHub Actions"], check=True)
          subprocess.run([
              "git", "config", "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com",
          ], check=True)
          subprocess.run(["git", "add", "Codeforces"], check=True)
          subprocess.run([
              "git", "commit", "-m",
              f"Sync accepted Codeforces source for {len(set(changed_files))} problem file(s)",
          ], check=True)
          branch = os.environ.get("GITHUB_REF_NAME") or "main"
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
          print(f"Pushed {len(set(changed_files))} source file(s) to {branch}.")
          PY
