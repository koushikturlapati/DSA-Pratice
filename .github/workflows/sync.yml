name: Sync Codeforces Submissions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Update Codeforces activity log
        env:
          CF_HANDLE: "venkous_7"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import requests

          handle = os.environ.get("CF_HANDLE", "").strip()
          if not handle:
              raise SystemExit("CF_HANDLE is empty")

          response = requests.get(
              "https://codeforces.com/api/user.status",
              params={"handle": handle, "from": 1, "count": 1000},
              headers={"User-Agent": "github-actions-codeforces-sync"},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()

          if payload.get("status") != "OK":
              raise SystemExit(
                  f"Codeforces API error for {handle}: "
                  f"{payload.get('comment') or payload}"
              )

          accepted = [
              submission for submission in payload.get("result", [])
              if submission.get("verdict") == "OK"
          ]
          accepted.reverse()  # write older submissions first
          print(f"Found {len(accepted)} accepted submissions for {handle}.")

          log_path = Path("activity.log")
          existing = log_path.read_text(encoding="utf-8") if log_path.exists() else ""
          added = 0

          with log_path.open("a", encoding="utf-8") as log:
              for submission in accepted:
                  submission_id = str(submission.get("id", ""))
                  timestamp = submission.get("creationTimeSeconds")
                  if not submission_id or timestamp is None:
                      continue
                  if f"ID {submission_id}" in existing:
                      continue

                  problem = submission.get("problem", {})
                  contest_id = problem.get("contestId", "?")
                  index = problem.get("index", "?")
                  name = problem.get("name", "Unknown problem")
                  language = submission.get("programmingLanguage", "Unknown language")
                  created = datetime.fromtimestamp(timestamp, tz=timezone.utc)
                  entry = (
                      "Codeforces Submission Verified: "
                      f"ID {submission_id} | Problem {contest_id}{index} - {name} | "
                      f"Language: {language} | "
                      f"at {created.strftime('%Y-%m-%d %H:%M:%S +0000')}\n"
                  )
                  log.write(entry)
                  existing += f"ID {submission_id}\n"
                  added += 1

          if added == 0:
              print("No new accepted submissions. Activity log is already up to date.")
              sys.exit(0)

          subprocess.run(["git", "config", "user.name", "GitHub Actions"], check=True)
          subprocess.run([
              "git", "config", "user.email",
              "41898282+github-actions[bot]@users.noreply.github.com",
          ], check=True)
          subprocess.run(["git", "add", "activity.log"], check=True)
          subprocess.run([
              "git", "commit", "-m",
              f"Log {added} accepted Codeforces submission(s)",
          ], check=True)
          branch = os.environ.get("GITHUB_REF_NAME") or "main"
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
          print(f"Added {added} accepted submission record(s) to activity.log.")
          PY
