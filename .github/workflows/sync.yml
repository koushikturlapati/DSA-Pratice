name: Sync Codeforces Submissions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Workspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Complete Historical Scraper
        env:
          CF_HANDLE: "venkous_7"
        run: |
          pip install requests
          python -c "
          import requests, os, subprocess, datetime, time
          
          handle = os.environ['CF_HANDLE']
          url = f'https://codeforces.com{handle}&from=1&count=1000'
          res = requests.get(url).json()
          
          if res['status'] != 'OK':
              print('Could not connect to Codeforces API')
              exit(1)
              
          submissions = [s for s in res['result'] if s.get('verdict') == 'OK']
          print(f'Found {len(submissions)} accepted submissions. Processing...')
          
          # Setup basic git tracking credentials
          subprocess.run(['git', 'config', '--global', 'user.name', 'GitHub Actions'])
          subprocess.run(['git', 'config', '--global', 'user.email', 'actions@github.com'])
          
          for sub in reversed(submissions):
              p = sub['problem']
              prob_name = f\"{p['contestId']}{p['index']}_{p['name'].replace(' ', '_')}\"
              
              # Map extension based on language metadata
              lang = sub['programmingLanguage'].lower()
              ext = '.cpp' if 'c++' in lang else '.py' if 'python' in lang else '.java' if 'java' in lang else '.txt'
              filename = f'{prob_name}{ext}'
              
              if os.path.exists(filename):
                  continue
                  
              # Generate template problem structure
              with open(filename, 'w', encoding='utf-8') as f:
                  f.write(f'// Solution for Codeforces Problem: {prob_name}\n')
                  f.write(f'// Submission ID: {sub[\"id\"]}\n\n')
                  f.write('// Code downloaded via automated synchronization workflow.\n')
              
              # Extract precise historical timestamp
              sub_time = datetime.datetime.fromtimestamp(sub['creationTimeSeconds']).strftime('%Y-%m-%d %H:%M:%S')
              
              # Force backdated commit architecture
              os.environ['GIT_AUTHOR_DATE'] = sub_time
              os.environ['GIT_COMMITTER_DATE'] = sub_time
              
              subprocess.run(['git', 'add', filename])
              subprocess.run(['git', 'commit', '-m', f'Solve {prob_name} (Backdated Submission)'])
              
          # Push everything up to the default repository branch securely
          subprocess.run(['git', 'push', 'origin', 'main'])
          "
