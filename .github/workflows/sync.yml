name: Sync Codeforces Submissions

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every night at midnight
  workflow_dispatch:     # Enables the manual "Run workflow" action button

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Workspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Backdate Activity Log Without Files
        env:
          CF_HANDLE: "venkous_7"
        run: |
          pip install requests
          python -c "
          import requests
          import os
          import subprocess
          from datetime import datetime

          handle = os.environ['CF_HANDLE']
          url = f'https://codeforces.com{handle}&from=1&count=1000'
          
          try:
              res = requests.get(url, timeout=15).json()
          except Exception as e:
              print(f'API Connection Timeout: {e}')
              exit(1)

          if res.get('status') != 'OK':
              print('API Connection Refused by Codeforces')
              exit(1)

          # Extract only valid accepted submissions
          submissions = [s for s in res['result'] if s.get('verdict') == 'OK']
          print(f'Found {len(submissions)} accepted solutions. Injecting timeline metadata...')

          if not submissions:
              print('No solutions found to track.')
              exit(0)

          # Configure safe automated system commit authorities
          subprocess.run(['git', 'config', '--global', 'user.name', 'GitHub Actions'])
          subprocess.run(['git', 'config', '--global', 'user.email', 'actions@github.com'])

          log_file = 'activity.log'
          any_new_commits = False

          # Process chronologically in the past
          for sub in reversed(submissions):
              submission_id = sub['id']
              timestamp = sub['creationTimeSeconds']
              formatted_date = datetime.fromtimestamp(timestamp).strftime('%Y-%m-%d %H:%M:%S')

              # Unique verification tag signature instead of code files
              log_entry = f'Codeforces Submission Verified: ID {submission_id} at {formatted_date}\n'

              # Check if this specific submission was already logged
              if os.path.exists(log_file):
                  with open(log_file, 'r', encoding='utf-8') as f:
                      if str(submission_id) in f.read():
                          continue

              # Append metadata directly to the single timeline tracker file
              with open(log_file, 'a', encoding='utf-8') as f:
                  f.write(log_entry)

              # Overwrite Git author timeline metrics safely to forge the past calendar grids
              os.environ['GIT_AUTHOR_DATE'] = formatted_date
              os.environ['GIT_COMMITTER_DATE'] = formatted_date

              subprocess.run(['git', 'add', log_file])
              subprocess.run(['git', 'commit', '-m', f'Sync Profile History Reference ID {submission_id} (Backdated)'])
              any_new_commits = True

          # Push changes up to the default cloud branch
          if any_new_commits:
              subprocess.run(['git', 'push', 'origin', 'main'])
              print('Activity history pipeline updated successfully!')
          else:
              print('Calendar records are already up to date.')
          "
