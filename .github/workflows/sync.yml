name: Sync Codeforces Submissions

on:
  schedule:
    # Run once a day at midnight UTC.
    - cron: "0 0 * * *"
  workflow_dispatch:

# The workflow commits activity.log back to this repository.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sync accepted Codeforces submissions
        env:
          CF_HANDLE: "venkous_7"
          CF_API_URL: "https://codeforces.com/api/user.status"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone

          import requests

          handle = os.environ["CF_HANDLE"]
          api_url = os.environ["CF_API_URL"]

          try:
              response = requests.get(
                  api_url,
                  params={"handle": handle, "from": 1, "count": 1000},
                  headers={"User-Agent": "github-actions-codeforces-sync"},
                  timeout=30,
              )
              response.raise_for_status()
              payload = response.json()
          except (requests.RequestException, ValueError) as error:
              print(f"Codeforces API request failed: {error}", file=sys.stderr)
              sys.exit(1)

          if payload.get("status") != "OK":
              print(f"Codeforces API returned an error: {payload}", file=sys.stderr)
              sys.exit(1)

          accepted = [
              submission
              for submission in payload.get("result", [])
              if submission.get("verdict") == "OK"
          ]
          print(f"Found {len(accepted)} accepted submissions for {handle}.")

          if not accepted:
              print("No accepted submissions found; nothing to commit.")
              sys.exit(0)

          log_file = "activity.log"
          existing = ""
          if os.path.exists(log_file):
              with open(log_file, encoding="utf-8") as log:
                  existing = log.read()

          subprocess.run(["git", "config", "user.name", "GitHub Actions"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )

          added = 0
          # Codeforces returns newest submissions first. Reversing makes the
          # generated history chronological when several records are new.
          for submission in reversed(accepted):
              submission_id = str(submission["id"])
              if f"ID {submission_id} " in existing:
                  continue

              created = datetime.fromtimestamp(
                  submission["creationTimeSeconds"], tz=timezone.utc
              )
              formatted_date = created.strftime("%Y-%m-%d %H:%M:%S +0000")
              log_entry = (
                  f"Codeforces Submission Verified: ID {submission_id} "
                  f"at {formatted_date}\n"
              )

              with open(log_file, "a", encoding="utf-8") as log:
                  log.write(log_entry)
              existing += log_entry

              env = os.environ.copy()
              env["GIT_AUTHOR_DATE"] = formatted_date
              env["GIT_COMMITTER_DATE"] = formatted_date
              subprocess.run(["git", "add", log_file], check=True)
              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"Sync Codeforces submission {submission_id}",
                  ],
                  check=True,
                  env=env,
              )
              added += 1

          if added:
              branch = os.environ.get("GITHUB_REF_NAME", "main")
              subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
              print(f"Added and pushed {added} new submission record(s).")
          else:
              print("Activity log is already up to date.")
          PY
