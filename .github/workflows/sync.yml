name: Sync Codeforces Submissions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Workspace
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute True Code Content Scraper
        env:
          CF_HANDLE: "venkous_7"
        run: |
          pip install requests beautifulsoup4
          python -c "
          import requests
          import os
          import subprocess
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime

          handle = os.environ['CF_HANDLE']
          url = f'https://codeforces.com{handle}&from=1&count=1000'
          
          try:
              res = requests.get(url, timeout=15).json()
          except Exception as e:
              print(f'API Connection Error: {e}')
              exit(1)

          if res.get('status') != 'OK':
              print('API Connection Refused')
              exit(1)

          submissions = [s for s in res['result'] if s.get('verdict') == 'OK']
          print(f'Successfully pulled {len(submissions)} accepted problems. Extracting raw code content...')

          subprocess.run(['git', 'config', '--global', 'user.name', 'GitHub Actions'])
          subprocess.run(['git', 'config', '--global', 'user.email', 'actions@github.com'])

          any_new_commits = False

          for sub in reversed(submissions):
              prob = sub['problem']
              contest_id = prob.get('contestId', '')
              prob_index = prob.get('index', '')
              prob_name = prob.get('name', '').replace(' ', '_')
              submission_id = sub['id']
              
              if not contest_id or not prob_index:
                  continue

              folder_name = f'Codeforces/{contest_id}{prob_index}'
              os.makedirs(folder_name, exist_ok=True)

              lang = sub['programmingLanguage'].lower()
              ext = '.cpp' if 'c++' in lang else '.py' if 'python' in lang else '.java' if 'java' in lang else '.txt'
              file_path = os.path.join(folder_name, f'{prob_name}{ext}')

              if os.path.exists(file_path):
                  continue

              # Web scrape the actual code page from Codeforces
              code_text = ''
              try:
                  source_url = f'https://codeforces.com{contest_id}/submission/{submission_id}'
                  page = requests.get(source_url, timeout=15)
                  soup = BeautifulSoup(page.text, 'html.parser')
                  program_source = soup.find('pre', id='program-source-text')
                  if program_source:
                      code_text = program_source.text
              except Exception as e:
                  print(f'Failed parsing solution text for {submission_id}: {e}')

              # Fallback text if scraping was blocked or restricted by the platform
              if not code_text.strip():
                  code_text = f'// Codeforces Problem: {contest_id}{prob_index} - {prob_name}\n// Submission ID: {submission_id}\n// Code block could not be extracted.'

              with open(file_path, 'w', encoding='utf-8') as f:
                  f.write(code_text)

              formatted_date = datetime.fromtimestamp(sub['creationTimeSeconds']).strftime('%Y-%m-%d %H:%M:%S')
              os.environ['GIT_AUTHOR_DATE'] = formatted_date
              os.environ['GIT_COMMITTER_DATE'] = formatted_date

              subprocess.run(['git', 'add', file_path])
              subprocess.run(['git', 'commit', '-m', f'Sync {contest_id}{prob_index}: {prob_name} (Source Added)'])
              any_new_commits = True

          if any_new_commits:
              subprocess.run(['git', 'push', 'origin', 'main'])
              print('Historical solution codebases successfully synchronized backdated!')
          else:
              print('Repository structure is completely up to date.')
          "
