name: Sync Codeforces Submissions

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Sync Codeforces accepted submissions
        env:
          CF_HANDLE: "venkous_7"
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from datetime import datetime, timezone

          import requests

          handle = os.environ.get("CF_HANDLE", "").strip()
          if not handle:
              print("CF_HANDLE is empty; skipping sync.")
              sys.exit(0)

          api_url = "https://codeforces.com/api/user.status"
          print(f"Fetching Codeforces submissions for handle: {handle}")

          try:
              response = requests.get(
                  api_url,
                  params={"handle": handle, "from": 1, "count": 1000},
                  headers={"User-Agent": "github-actions-codeforces-sync"},
                  timeout=30,
              )
              response.raise_for_status()
              payload = response.json()
          except Exception as e:
              print(f"Codeforces API request failed: {e}")
              sys.exit(0)

          if payload.get("status") != "OK":
              message = payload.get("comment") or payload.get("error") or str(payload)
              print(f"Codeforces API returned non-OK status for handle '{handle}': {message}")
              sys.exit(0)

          results = payload.get("result") or []
          accepted = [r for r in results if r.get("verdict") == "OK"]
          print(f"Found {len(accepted)} accepted submissions.")

          if not accepted:
              print("No accepted submissions found; nothing to commit.")
              sys.exit(0)

          subprocess.run(["git", "config", "user.name", "GitHub Actions"], check=True)
          subprocess.run(
              ["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"],
              check=True,
          )

          log_file = "activity.log"
          existing = ""
          if os.path.exists(log_file):
              with open(log_file, "r", encoding="utf-8") as f:
                  existing = f.read()

          added = 0
          for submission in reversed(accepted):
              submission_id = str(submission.get("id"))
              if not submission_id:
                  continue
              if f"ID {submission_id}" in existing:
                  continue

              ts = submission.get("creationTimeSeconds")
              if ts is None:
                  continue

              created = datetime.fromtimestamp(ts, tz=timezone.utc)
              formatted = created.strftime("%Y-%m-%d %H:%M:%S +0000")
              log_entry = f"Codeforces Submission Verified: ID {submission_id} at {formatted}\n"

              with open(log_file, "a", encoding="utf-8") as f:
                  f.write(log_entry)
              existing += log_entry

              env = os.environ.copy()
              env["GIT_AUTHOR_DATE"] = formatted
              env["GIT_COMMITTER_DATE"] = formatted

              subprocess.run(["git", "add", log_file], check=True)
              try:
                  subprocess.run(
                      ["git", "commit", "-m", f"Sync CF submission {submission_id}"],
                      check=True,
                      env=env,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      text=True,
                  )
              except subprocess.CalledProcessError as e:
                  # If nothing actually changed, skip quietly.
                  print(f"Commit skipped for {submission_id}: {e.stderr.strip()}")
                  continue

              added += 1

          if added == 0:
              print("No new submissions to push.")
              sys.exit(0)

          branch = os.environ.get("GITHUB_REF_NAME") or "main"
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
          print(f"Pushed {added} new submission record(s) to {branch}.")
          PY
